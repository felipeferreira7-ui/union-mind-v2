<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Página não encontrada | Union Mind</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            font-family: 'League Spartan', sans-serif;
        }

        .container-404 {
            padding: 2rem;
        }

        h1 {
            font-size: 8rem;
            margin: 0;
            color: var(--accent-color);
        }

        p {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #888;
        }

        .btn-cta {
            display: inline-block;
            text-decoration: none;
        }
    </style>
    <script>
        // Redirect to home after 5 seconds
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 5000);
    </script>
</head>

<body>
    <div class="container-404">
        <h1>404</h1>
        <p>A página que você procura foi movida ou não existe mais.</p>
        <p>Você será redirecionado para a nossa nova home em instantes...</p>
        <a href="index.html" class="btn-cta"><span>Voltar para Home agora</span></a>
    </div>
</body>

</html>
