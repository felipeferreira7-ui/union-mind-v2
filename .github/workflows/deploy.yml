name: Deploy Union Mind para GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Gerar páginas e versões de idioma
        run: |
          python3 03_SITE/scripts_build/generate_seo.py
          python3 03_SITE/scripts_build/build_languages.py

      - name: Verificar páginas e formulários sem envio real
        run: |
          python3 03_SITE/scripts_build/check_site.py
          node 03_SITE/scripts_build/check_forms.js
          node 03_SITE/scripts_build/check_analytics.js

      - name: Preparar somente arquivos públicos
        run: |
          python3 03_SITE/scripts_build/prepare_public.py

      - name: Upload artifact (site público)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site_public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
